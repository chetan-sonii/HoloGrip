<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}HoloGrip{% endblock %}</title>

    <meta name="description"
          content="HoloGrip - An ESP32 and MPU6050 based motion interaction project.">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Animate.css -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    >

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/main.css') }}"
    >

    {% block extra_css %}{% endblock %}

    <style>
        body {
            background: #ffffff;
            color: #111827;
        }

        /* =========================
           NAVBAR
        ========================= */
        .main-navbar {
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid #e5e7eb;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #111827 !important;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: #eef2ff;
            color: #4f46e5;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .navbar-nav .nav-link {
            color: #64748b;
            font-size: 0.92rem;
            font-weight: 650;
            padding: 8px 12px !important;
            transition: color 0.2s ease;
        }

        .navbar-nav .nav-link:hover,
        .navbar-nav .nav-link.active {
            color: #4f46e5;
        }

        .navbar-resource {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 9px 13px;
            border-radius: 10px;
            margin-left: 7px;
            transition: all 0.2s ease;
        }

        .github-link {
            color: #111827;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }

        .github-link:hover {
            color: #ffffff;
            background: #111827;
            border-color: #111827;
        }

        .youtube-link {
            color: #ffffff;
            background: #4f46e5;
            border: 1px solid #4f46e5;
        }

        .youtube-link:hover {
            color: #ffffff;
            background: #3730a3;
            border-color: #3730a3;
        }

        /* =========================
           FOOTER
        ========================= */
        .site-footer {
            border-top: 1px solid #e5e7eb;
            background: #ffffff;
            padding: 28px 0;
        }

        .footer-brand {
            color: #111827;
            font-weight: 800;
            text-decoration: none;
        }

        .footer-text {
            color: #94a3b8;
            font-size: 0.84rem;
            margin: 5px 0 0;
        }

        .footer-links {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
        }

        .footer-link {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #64748b;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }

        .footer-link:hover {
            color: #4f46e5;
            border-color: #c7d2fe;
            transform: translateY(-2px);
        }

        @media (max-width: 991.98px) {
            .navbar-resource {
                margin: 5px 0;
                display: flex;
                width: fit-content;
            }

            .footer-links {
                justify-content: flex-start;
                margin-top: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->
    <nav class="navbar navbar-expand-lg main-navbar">
        <div class="container">

            <a class="navbar-brand"
               href="{{ url_for('main.index') }}">

                <span class="brand-icon">
                    <i class="bi bi-compass"></i>
                </span>

                <span>HoloGrip</span>
            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>


            <div class="collapse navbar-collapse" id="mainNavbar">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a
                            class="nav-link {% if request.endpoint == 'main.index' %}active{% endif %}"
                            href="{{ url_for('main.index') }}"
                        >
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link {% if request.endpoint == 'main.project' %}active{% endif %}"
                            href="{{ url_for('main.project') }}"
                        >
                            Project
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link {% if request.endpoint == 'main.implementation' %}active{% endif %}"
                            href="{{ url_for('main.implementation') }}"
                        >
                            Implementation
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link {% if request.endpoint == 'main.team' %}active{% endif %}"
                            href="{{ url_for('main.team') }}"
                        >
                            Team
                        </a>
                    </li>

                    <!-- GitHub -->
                    <li class="nav-item">
                        <a
                            class="navbar-resource github-link"
                            href="https://github.com/chetan-sonii/HoloGrip.git"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            <i class="bi bi-github"></i>
                            Github
                        </a>
                    </li>

                    <!-- YouTube -->
                    <li class="nav-item">
                        <a
                            class="navbar-resource youtube-link"
                            href="https://www.youtube.com/shorts/zf-vR_R6oDQ"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            <i class="bi bi-youtube"></i>
                            Demo
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>


    <!-- =========================
         PAGE CONTENT
    ========================== -->
    <main>
        {% block content %}{% endblock %}
    </main>


    <!-- =========================
         FOOTER
    ========================== -->
    <footer class="site-footer">
        <div class="container">

            <div class="row align-items-center">

                <div class="col-md-7">
                    <a
                        href="{{ url_for('main.index') }}"
                        class="footer-brand"
                    >
                        HoloGrip
                    </a>

                    <p class="footer-text">
                        ESP32 + MPU6050 based motion interaction project.
                    </p>
                </div>


                <div class="col-md-5">

                    <div class="footer-links">

                        <a
                            href="https://github.com/chetan-sonii/HoloGrip.git"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="footer-link"
                            aria-label="GitHub Repository"s
                            title="GitHub Repository"
                        >
                            <i class="bi bi-github"></i>
                        </a>

                        <a
                            href="https://www.youtube.com/shorts/zf-vR_R6oDQ"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="footer-link"
                            aria-label="YouTube Demo"
                            title="YouTube Demo"
                        >
                            <i class="bi bi-youtube"></i>
                        </a>

                    </div>

                </div>

            </div>

        </div>
    </footer>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Main JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
